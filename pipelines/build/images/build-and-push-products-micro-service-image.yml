
trigger:
  branches:
    include:
      - develop

resources:
- repo: self

variables:
  - group: docker-hub
  - name: tag
    value: '$(Build.BuildId)'
  - name: vmImageName
    value: 'ubuntu-latest'
  - name: aksNameSpace
    value: 'dev'

stages:

- stage: Test
  displayName: Test Product Service
  jobs:
  - job: Test_Products_Service
    displayName: Run and execute products service test
    pool:
      vmImage: 'windows-latest'
    steps:
    - checkout: self
      displayName: Checkout source code
    - task: NuGetToolInstaller@1
      displayName: Install Nuget 
      inputs:
        versionSpec: 
    - task: NuGetCommand@2
      displayName: Nuget Restore Packages
      inputs:
        command: 'restore'
        restoreSolution: '$(Build.SourcesDirectory)/eCommerceSolution.ProductsService/eCommerceSolution.ProductsService.sln'
        feedsToUse: 'select'
    - task: VSBuild@1
      inputs:
        solution: '$(Build.SourcesDirectory)/eCommerceSolution.ProductsService/eCommerceSolution.ProductsService.sln'
        vsVersion: '17.0'
        platform: 'Any CPU'
        configuration: 'Debug'
        msbuildArchitecture: 'x64'

    - task: VSTest@3
      inputs:
        azureSubscription: 'Dentsu(cce8043b-d059-4c18-82ac-3a35dc504a2c)'
        testSelector: 'testAssemblies'
        testAssemblyVer2: |
          **\bin\**\*test.dll
          **\bin\**\*tests.dll
        searchFolder: '$(System.DefaultWorkingDirectory)/eCommerceSolution.ProductsService'

- stage: Build
  displayName: Build image
  dependsOn: Test
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
   
    - script: |
        docker login -u rbcadaing -p $(docker_pw)
        docker compose -f docker-compose.build.yaml build products-microservice
        docker tag rbcadaing/products-microservice:latest rbcadaing/products-microservice:$(tag)
        docker image ls
        docker push rbcadaing/products-microservice:$(tag)
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: "Build And Push Products Microservice"

- stage: DeployToDev
  displayName: Deploy Product Microservice to dev
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
  jobs:
  - deployment: DeployToDev
    displayName: Deploy To Dev Environment
    environment: dev
    strategy:
      runOnce:
        deploy:
          steps:
            - checkout: self

            - script: |
                echo "Listing contents of k8s"
                ls -l $(Build.SourcesDirectory)/aks/
              displayName: List aks manifest files
