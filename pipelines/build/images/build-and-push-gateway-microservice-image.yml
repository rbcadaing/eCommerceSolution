
resources:
- repo: self

variables:
  - group: docker-hub
  - name: tag
    value: '$(Build.BuidId)'
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - script: |
        docker login -u rbcadaing -p $(docker_pw)
        docker compose -f docker-compose.build.yaml build apigateway-microservice
        docker image ls
        docker tag rbcadaing/apigateway:latest rbcadaing/apigateway:$(tag)
        docker compose -f docker-compose.build.yaml push apigateway-microservice
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: "Build And Push Api Gateway Microservice"

