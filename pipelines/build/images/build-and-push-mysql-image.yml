
resources:
- repo: self

variables:
  - group: docker-hub
  - name: tag
    value: '$(Build.BuildId)'
  - name: vmImageName
    value: 'ubuntu-latest'
    
stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
   
    - script: |
        docker login -u rbcadaing -p $(docker_pw)
        docker build -t rbcadaing/ecommerce-mysql:latest .
        docker tag rbcadaing/ecommerce-mysql:latest rbcadaing/ecommerce-mysql:$(tag)
        docker image ls
        docker push rbcadaing/ecommerce-mysql:$(tag)
      workingDirectory: '$(Build.SourcesDirectory)/deployment/mysql'
      displayName: "Run script in subfolder"

