
resources:
- repo: self

variables:
  - group: docker-hub
  - name: tag
    value: '$(Build.BuildId)'
  - name: vmImageName
    value: 'ubuntu-latest'
    
stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
   
    - script: |
        docker login -u rbcadaing -p $(docker_pw)
        docker compose -f docker-compose.build.yaml build users-microservice
        docker tag rbcadaing/users-microservice:latest rbcadaing/users-microservice:$(tag)
        docker image ls
        docker push rbcadaing/users-microservice:$(tag)
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: "Build And Push Users Microservice"

