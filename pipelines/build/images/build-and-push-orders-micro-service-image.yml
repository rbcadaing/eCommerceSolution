
resources:
- repo: self

variables:
  - group: docker-hub
  - name: tag
    value: '$(Build.BuildId)'
  - name: vmImageName
    value: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build image
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
   
    - script: |
        docker login -u rbcadaing -p $(docker_pw)
        docker compose -f docker-compose.build.yaml build orders-microservice
        docker tag rbcadaing/orders-microservice:latest rbcadaing/orders-microservice:$(tag)
        docker image ls
        docker push rbcadaing/orders-microservice:$(tag)
      workingDirectory: '$(Build.SourcesDirectory)'
      displayName: "Build And Push Orders Microservice"

